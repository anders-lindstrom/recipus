  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 176h272l-26 200a34 34 0 0 1-34 30H180a34 34 0 0 1-34-30z"/>
    <path d="M196 176c0-46 27-78 60-78s60 32 60 78"/>
  </g>
  <g fill="#ffffff" opacity="0.92">
    <rect x="186" y="236" width="140" height="26" rx="13"/>
    <rect x="186" y="286" width="140" height="26" rx="13"/>
    <rect x="186" y="336" width="88" height="26" rx="13"/>
  </g>
</svg>
