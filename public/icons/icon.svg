<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Recipus">
  <!--
    A basket whose contents are the list: three tiles stacked where the goods
    would be. Reads as groceries at 512px and stays legible as a 48px launcher
    icon, which rules out anything with fine detail.
  -->
